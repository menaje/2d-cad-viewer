name: Release packages

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Manual runs never publish
        required: true
        type: choice
        default: dry-run
        options:
          - dry-run
          - verify-auth
  pull_request:
    branches:
      - prerelease
      - main
    types:
      - closed

concurrency:
  group: dwg-viewer-release-${{ github.event.pull_request.base.ref || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  context:
    name: Release context
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      build: ${{ steps.route.outputs.build }}
      channel: ${{ steps.route.outputs.channel }}
      prerelease: ${{ steps.route.outputs.prerelease }}
      publish: ${{ steps.route.outputs.publish }}
      release_sha: ${{ steps.route.outputs.release_sha }}
      version: ${{ steps.route.outputs.version }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}

      - name: Resolve merge route and release channel
        id: route
        env:
          RELEASE_MANUAL_MODE: ${{ inputs.mode }}
        run: node scripts/release-channel.mjs

  marketplace-auth:
    name: Verify Marketplace authentication
    needs: context
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'verify-auth'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.context.outputs.release_sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.12.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install locked publishing dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify publisher access without publishing
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [[ -z "$VSCE_PAT" ]]; then
            echo "VSCE_PAT is required for Marketplace publication" >&2
            exit 1
          fi
          pnpm --dir apps/vscode-extension exec vsce verify-pat menaje

  vsix:
    name: MPL VSIX
    needs:
      - context
      - adapter
    if: needs.context.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.context.outputs.release_sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.12.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/download-artifact@v8
        with:
          pattern: dwg-viewer-*
          path: ${{ runner.temp }}/engine-assets
          merge-multiple: true

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release versions
        id: version
        shell: bash
        run: |
          repository_version=$(node -p "require('./package.json').version")
          extension_version=$(node -p "require('./apps/vscode-extension/package.json').version")
          if [[ "$repository_version" != "$extension_version" ]]; then
            echo "repository and viewer extension versions differ" >&2
            exit 1
          fi
          if [[ "$repository_version" != "${{ needs.context.outputs.version }}" ]]; then
            echo "release context version does not match the checked-out repository" >&2
            exit 1
          fi
          printf 'version=%s\n' "$repository_version" >> "$GITHUB_OUTPUT"

      - name: Build, reproduce, and inspect VSIX
        shell: bash
        run: |
          release_directory="$RUNNER_TEMP/release"
          package_name="dwg-viewer-vscode-${{ steps.version.outputs.version }}.vsix"
          catalog_path="$RUNNER_TEMP/engine-assets.json"
          package_flags=(--no-dependencies)
          if [[ "${{ needs.context.outputs.channel }}" == "prerelease" ]]; then
            package_flags+=(--pre-release)
          fi
          mkdir "$release_directory"
          node scripts/create-engine-catalog.mjs \
            --directory "$RUNNER_TEMP/engine-assets" \
            --version "${{ steps.version.outputs.version }}" \
            --output "$catalog_path"
          DWG_VIEWER_ENGINE_CATALOG="$catalog_path" \
            pnpm --dir apps/vscode-extension run build
          pnpm --dir apps/vscode-extension exec vsce package \
            "${package_flags[@]}" \
            --out "$release_directory/$package_name"
          pnpm --dir apps/vscode-extension exec vsce package \
            "${package_flags[@]}" \
            --out "$release_directory/repeated.vsix"
          node scripts/normalize-vsix-archive.mjs \
            "$release_directory/$package_name" \
            "$release_directory/repeated.vsix"
          cmp \
            "$release_directory/$package_name" \
            "$release_directory/repeated.vsix"
          unzip -Z1 "$release_directory/$package_name" > "$release_directory/vsix-files.txt"
          grep -Fxq "extension/LICENSE.txt" "$release_directory/vsix-files.txt"
          grep -Fxq "extension/NOTICE" "$release_directory/vsix-files.txt"
          grep -Fxq "extension/THIRD_PARTY_NOTICES.md" "$release_directory/vsix-files.txt"
          grep -Fxq "extension/readme.md" "$release_directory/vsix-files.txt"
          grep -Fxq "extension/dist/engine-assets.json" "$release_directory/vsix-files.txt"
          test "$(sha256sum LICENSE | cut -d ' ' -f 1)" = \
            "3f3d9e0024b1921b067d6f7f88deb4a60cbe7a78e76c64e3f1d7fc3b779b9d04"
          cmp <(unzip -p "$release_directory/$package_name" extension/LICENSE.txt) LICENSE
          cmp <(unzip -p "$release_directory/$package_name" extension/NOTICE) NOTICE
          cmp \
            <(unzip -p "$release_directory/$package_name" extension/THIRD_PARTY_NOTICES.md) \
            THIRD_PARTY_NOTICES.md
          if grep -Eiq '(^|/)native/|libredwg-adapter' "$release_directory/vsix-files.txt"; then
            echo "GPL adapter content must not be present in the MPL VSIX" >&2
            exit 1
          fi
          unzip -p "$release_directory/$package_name" extension/readme.md \
            | grep -Fq "https://github.com/menaje/dwg-viewer"
          cmp \
            <(unzip -p "$release_directory/$package_name" extension/dist/engine-assets.json) \
            "$catalog_path"

      - name: Attest VSIX provenance
        uses: actions/attest@v4
        with:
          subject-path: ${{ runner.temp }}/release/dwg-viewer-vscode-${{ steps.version.outputs.version }}.vsix

      - name: Upload VSIX
        uses: actions/upload-artifact@v7
        with:
          name: dwg-viewer-vscode
          retention-days: 14
          path: ${{ runner.temp }}/release/dwg-viewer-vscode-${{ steps.version.outputs.version }}.vsix
          archive: false
          if-no-files-found: error

  adapter:
    name: GPL adapter (${{ matrix.target }})
    needs: context
    if: needs.context.outputs.build == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x64
          - runner: macos-14
            target: darwin-arm64
          - runner: macos-15-intel
            target: darwin-x64
          - runner: windows-2025
            target: win32-x64

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.context.outputs.release_sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.12.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install locked packaging dependencies
        run: pnpm install --frozen-lockfile

      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: UCRT64
          update: true
          path-type: inherit
          install: >-
            diffutils
            make
            tar
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf

      - name: Build checksum-pinned static adapter
        if: runner.os != 'Windows'
        shell: bash
        run: |
          adapters/libredwg/prepare.sh \
            "$RUNNER_TEMP/dwg-libredwg-build" \
            "$RUNNER_TEMP/libredwg-adapter"

      - name: Run bounded self-diagnosis
        if: runner.os != 'Windows'
        shell: bash
        run: |
          DWG_VIEWER_ADAPTER_PROTOCOL=dwg-engine-adapter/1 \
          DWG_VIEWER_BENCHMARK_PHASE=doctor \
            "$RUNNER_TEMP/libredwg-adapter" doctor

      - name: Create and reproduce GPL source-complete package
        if: runner.os != 'Windows'
        shell: bash
        run: |
          package_path="$RUNNER_TEMP/dwg-viewer-libredwg-0.14-${{ matrix.target }}.tar.gz"
          repeated_path="$RUNNER_TEMP/dwg-viewer-libredwg-0.14-${{ matrix.target }}-repeated.tar.gz"
          node adapters/libredwg/package.mjs \
            --adapter "$RUNNER_TEMP/libredwg-adapter" \
            --libredwg-source "$RUNNER_TEMP/dwg-libredwg-build/libredwg-0.14.tar.xz" \
            --output "$package_path"
          node adapters/libredwg/package.mjs \
            --adapter "$RUNNER_TEMP/libredwg-adapter" \
            --libredwg-source "$RUNNER_TEMP/dwg-libredwg-build/libredwg-0.14.tar.xz" \
            --output "$repeated_path"
          cmp "$package_path" "$repeated_path"

      - name: Verify extracted checksums and executable
        if: runner.os != 'Windows'
        shell: bash
        run: |
          package_path="$RUNNER_TEMP/dwg-viewer-libredwg-0.14-${{ matrix.target }}.tar.gz"
          mkdir "$RUNNER_TEMP/extracted"
          tar -xzf "$package_path" -C "$RUNNER_TEMP/extracted"
          package_root=$(find "$RUNNER_TEMP/extracted" -mindepth 1 -maxdepth 1 -type d)
          cd "$package_root"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum -c SHA256SUMS
          else
            shasum -a 256 -c SHA256SUMS
          fi
          bin/libredwg-adapter doctor

      - name: Build, diagnose, reproduce, and verify Windows package
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          runner_temp=$(cygpath -u "$RUNNER_TEMP")
          build_root="$runner_temp/dwg-libredwg-build"
          adapter_path="$runner_temp/libredwg-adapter.exe"
          package_path="$runner_temp/dwg-viewer-libredwg-0.14-${{ matrix.target }}.tar.gz"
          repeated_path="$runner_temp/dwg-viewer-libredwg-0.14-${{ matrix.target }}-repeated.tar.gz"
          export DWG_VIEWER_TAR
          export DWG_VIEWER_OBJDUMP
          DWG_VIEWER_TAR=$(cygpath -w /usr/bin/tar.exe)
          DWG_VIEWER_OBJDUMP=$(cygpath -w /ucrt64/bin/objdump.exe)
          adapters/libredwg/prepare.sh "$build_root" "$adapter_path"
          DWG_VIEWER_ADAPTER_PROTOCOL=dwg-engine-adapter/1 \
          DWG_VIEWER_BENCHMARK_PHASE=doctor \
            "$adapter_path" doctor
          node adapters/libredwg/package.mjs \
            --adapter "$adapter_path" \
            --libredwg-source "$build_root/libredwg-0.14.tar.xz" \
            --output "$package_path"
          node adapters/libredwg/package.mjs \
            --adapter "$adapter_path" \
            --libredwg-source "$build_root/libredwg-0.14.tar.xz" \
            --output "$repeated_path"
          cmp "$package_path" "$repeated_path"
          mkdir "$runner_temp/extracted"
          tar -xzf "$package_path" -C "$runner_temp/extracted"
          package_root=$(find "$runner_temp/extracted" -mindepth 1 -maxdepth 1 -type d)
          cd "$package_root"
          sha256sum -c SHA256SUMS
          bin/libredwg-adapter.exe doctor

      - name: Stage version-matched native converter
        if: runner.os != 'Windows'
        shell: bash
        run: |
          version="${{ needs.context.outputs.version }}"
          target="${{ matrix.target }}"
          destination="$RUNNER_TEMP/dwg-viewer-native-converter-$version-$target"
          cp "$RUNNER_TEMP/libredwg-adapter" "$destination"
          chmod 700 "$destination"

      - name: Stage version-matched Windows native converter
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "${{ needs.context.outputs.version }}"
          $target = "${{ matrix.target }}"
          Copy-Item `
            "$env:RUNNER_TEMP\libredwg-adapter.exe" `
            "$env:RUNNER_TEMP\dwg-viewer-native-converter-$version-$target.exe"

      - name: Attest adapter provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            ${{ runner.temp }}/dwg-viewer-libredwg-0.14-${{ matrix.target }}.tar.gz
            ${{ runner.temp }}/dwg-viewer-native-converter-*-${{ matrix.target }}*

      - name: Upload adapter package
        uses: actions/upload-artifact@v7
        with:
          name: dwg-viewer-libredwg-archive-${{ matrix.target }}
          retention-days: 14
          path: ${{ runner.temp }}/dwg-viewer-libredwg-0.14-${{ matrix.target }}.tar.gz
          archive: false
          if-no-files-found: error

      - name: Upload version-matched native converter
        uses: actions/upload-artifact@v7
        with:
          name: dwg-viewer-native-converter-${{ matrix.target }}
          retention-days: 14
          path: ${{ runner.temp }}/dwg-viewer-native-converter-*-${{ matrix.target }}*
          archive: false
          if-no-files-found: error

  marketplace:
    name: Marketplace ${{ needs.context.outputs.channel }}
    needs:
      - context
      - vsix
      - github-release
    if: >-
      needs.context.outputs.publish == 'true' &&
      needs.github-release.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.context.outputs.release_sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.12.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/download-artifact@v8
        with:
          name: dwg-viewer-vscode
          path: dist

      - name: Install locked publishing dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify publisher access and Marketplace channel
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [[ -z "$VSCE_PAT" ]]; then
            echo "VSCE_PAT is required for Marketplace publication" >&2
            exit 1
          fi
          pnpm --dir apps/vscode-extension exec vsce verify-pat menaje
          node scripts/check-marketplace-version.mjs \
            menaje.dwg-viewer-vscode \
            "${{ needs.context.outputs.version }}" \
            "${{ needs.context.outputs.channel }}"

      - name: Publish the MPL viewer
        shell: bash
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          publish_flags=(--skip-duplicate)
          if [[ "${{ needs.context.outputs.channel }}" == "prerelease" ]]; then
            publish_flags+=(--pre-release)
          fi
          version="${{ needs.context.outputs.version }}"
          pnpm --dir apps/vscode-extension exec vsce publish \
            --packagePath "$GITHUB_WORKSPACE/dist/dwg-viewer-vscode-$version.vsix" \
            "${publish_flags[@]}"

  assemble:
    name: Checksums
    needs:
      - context
      - vsix
      - adapter
    if: needs.context.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.context.outputs.release_sha }}
      - uses: actions/download-artifact@v8
        with:
          pattern: dwg-viewer-*
          path: dist
          merge-multiple: true

      - name: Validate and checksum release set
        id: version
        shell: bash
        run: |
          release_version=$(node -p "require('./package.json').version")
          if [[ "$release_version" != "${{ needs.context.outputs.version }}" ]]; then
            echo "release context version does not match the checked-out repository" >&2
            exit 1
          fi
          test -f "dist/dwg-viewer-vscode-$release_version.vsix"
          test -f "dist/dwg-viewer-native-converter-$release_version-linux-x64"
          test -f "dist/dwg-viewer-native-converter-$release_version-darwin-arm64"
          test -f "dist/dwg-viewer-native-converter-$release_version-darwin-x64"
          test -f "dist/dwg-viewer-native-converter-$release_version-win32-x64.exe"
          test -f "dist/dwg-viewer-libredwg-0.14-linux-x64.tar.gz"
          test -f "dist/dwg-viewer-libredwg-0.14-darwin-arm64.tar.gz"
          test -f "dist/dwg-viewer-libredwg-0.14-darwin-x64.tar.gz"
          test -f "dist/dwg-viewer-libredwg-0.14-win32-x64.tar.gz"
          cd dist
          sha256sum \
            "dwg-viewer-vscode-$release_version.vsix" \
            "dwg-viewer-native-converter-$release_version-linux-x64" \
            "dwg-viewer-native-converter-$release_version-darwin-arm64" \
            "dwg-viewer-native-converter-$release_version-darwin-x64" \
            "dwg-viewer-native-converter-$release_version-win32-x64.exe" \
            "dwg-viewer-libredwg-0.14-linux-x64.tar.gz" \
            "dwg-viewer-libredwg-0.14-darwin-arm64.tar.gz" \
            "dwg-viewer-libredwg-0.14-darwin-x64.tar.gz" \
            "dwg-viewer-libredwg-0.14-win32-x64.tar.gz" \
            > SHA256SUMS
          printf 'version=%s\n' "$release_version" >> "$GITHUB_OUTPUT"

      - name: Attest the checksum release set
        uses: actions/attest@v4
        with:
          subject-checksums: dist/SHA256SUMS

      - name: Upload checksums
        uses: actions/upload-artifact@v7
        with:
          name: dwg-viewer-checksums
          retention-days: 14
          path: dist/SHA256SUMS
          archive: false
          if-no-files-found: error

  github-release:
    name: GitHub ${{ needs.context.outputs.channel }}
    needs:
      - context
      - assemble
    if: >-
      always() &&
      needs.context.outputs.publish == 'true' &&
      needs.assemble.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.context.outputs.release_sha }}
      - uses: actions/download-artifact@v8
        with:
          pattern: dwg-viewer-*
          path: dist
          merge-multiple: true

      - name: Create immutable tag and GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${{ needs.context.outputs.version }}"
          release_sha="${{ needs.context.outputs.release_sha }}"
          channel="${{ needs.context.outputs.channel }}"
          tag="v$version"

          git fetch origin --tags --force
          if git rev-parse --verify --quiet "refs/tags/$tag" >/dev/null; then
            tagged_sha=$(git rev-list -n 1 "$tag")
            if [[ "$tagged_sha" != "$release_sha" ]]; then
              echo "$tag already points to $tagged_sha instead of $release_sha" >&2
              exit 1
            fi
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$tag" "$release_sha" -m "DWG Viewer $tag"
            git push origin "refs/tags/$tag"
          fi

          release_notes="$RUNNER_TEMP/release-notes.md"
          if [[ "$channel" == "prerelease" ]]; then
            release_label="Prerelease"
          else
            release_label="Stable release"
          fi
          printf '%s\n\n%s\n\n%s\n\n%s\n\n%s\n' \
            "$release_label: open, inspect, search, measure, and export DWG drawings directly in VS Code." \
            "Navigation supports click-drag, two-finger trackpad panning, stronger pinch zoom, compact icon tools with hover labels, and English or Korean controls selected from the VS Code environment." \
            "The viewer installs and verifies its exact version-matched native converter in the background for Linux x64, macOS arm64, macOS Intel x64, or Windows x64." \
            "The main VSIX is MPL-2.0. Each separately downloaded GPL-3.0-or-later converter has a source-complete archive with unmodified license texts in this same release." \
            "Verify SHA256SUMS and the GitHub artifact attestations before installation." \
            > "$release_notes"

          files=(
            "dist/dwg-viewer-vscode-$version.vsix"
            "dist/dwg-viewer-native-converter-$version-linux-x64"
            "dist/dwg-viewer-native-converter-$version-darwin-arm64"
            "dist/dwg-viewer-native-converter-$version-darwin-x64"
            "dist/dwg-viewer-native-converter-$version-win32-x64.exe"
            "dist/dwg-viewer-libredwg-0.14-linux-x64.tar.gz"
            "dist/dwg-viewer-libredwg-0.14-darwin-arm64.tar.gz"
            "dist/dwg-viewer-libredwg-0.14-darwin-x64.tar.gz"
            "dist/dwg-viewer-libredwg-0.14-win32-x64.tar.gz"
            "dist/SHA256SUMS"
          )

          if gh release view "$tag" --json isPrerelease,assets > "$RUNNER_TEMP/existing-release.json" 2>/dev/null; then
            existing_prerelease=$(jq -r .isPrerelease "$RUNNER_TEMP/existing-release.json")
            expected_prerelease=false
            if [[ "$channel" == "prerelease" ]]; then
              expected_prerelease=true
            fi
            if [[ "$existing_prerelease" != "$expected_prerelease" ]]; then
              echo "$tag already exists in a different GitHub release channel" >&2
              exit 1
            fi
            existing_asset_directory="$RUNNER_TEMP/existing-release-assets"
            mkdir "$existing_asset_directory"
            for file in "${files[@]}"; do
              name=${file##*/}
              asset_count=$(jq \
                --arg name "$name" \
                '[.assets[]? | select(.name == $name)] | length' \
                "$RUNNER_TEMP/existing-release.json")
              if [[ "$asset_count" == "0" ]]; then
                gh release upload "$tag" "$file"
                continue
              fi
              if [[ "$asset_count" != "1" ]]; then
                echo "$tag contains duplicate assets named $name" >&2
                exit 1
              fi
              local_digest=$(sha256sum "$file" | cut -d ' ' -f 1)
              remote_digest=$(jq -r \
                --arg name "$name" \
                '.assets[] | select(.name == $name) | .digest // empty' \
                "$RUNNER_TEMP/existing-release.json")
              if [[ -z "$remote_digest" ]]; then
                gh release download "$tag" \
                  --pattern "$name" \
                  --dir "$existing_asset_directory"
                remote_digest="sha256:$(sha256sum "$existing_asset_directory/$name" | cut -d ' ' -f 1)"
              fi
              if [[ "$remote_digest" != "sha256:$local_digest" ]]; then
                echo "$tag asset $name is immutable and has different bytes" >&2
                exit 1
              fi
            done
          else
            release_flags=(--latest)
            if [[ "$channel" == "prerelease" ]]; then
              release_flags=(--prerelease --latest=false)
            fi
            gh release create "$tag" "${files[@]}" \
              --verify-tag \
              "${release_flags[@]}" \
              --title "DWG Viewer $tag" \
              --notes-file "$release_notes"
          fi
