name: Release packages

on:
  workflow_dispatch:
    inputs:
      publish_marketplace:
        description: Publish both extensions to the VS Code Marketplace as prereleases
        required: true
        type: boolean
        default: false
  push:
    tags:
      - "v[0-9]*"

permissions:
  contents: read

jobs:
  vsix:
    name: MPL VSIX
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 11.12.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release versions
        id: version
        shell: bash
        run: |
          repository_version=$(node -p "require('./package.json').version")
          extension_version=$(node -p "require('./apps/vscode-extension/package.json').version")
          companion_version=$(node -p "require('./apps/vscode-libredwg-adapter/package.json').version")
          if [[ "$repository_version" != "$extension_version" || "$repository_version" != "$companion_version" ]]; then
            echo "repository, viewer, and companion extension versions differ" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/* ]] && [[ "$GITHUB_REF_NAME" != "v$repository_version" ]]; then
            echo "release tag must be v$repository_version" >&2
            exit 1
          fi
          printf 'version=%s\n' "$repository_version" >> "$GITHUB_OUTPUT"

      - name: Build, reproduce, and inspect VSIX
        shell: bash
        run: |
          release_directory="$RUNNER_TEMP/release"
          package_name="dwg-viewer-vscode-${{ steps.version.outputs.version }}.vsix"
          mkdir "$release_directory"
          pnpm --dir apps/vscode-extension run build
          pnpm --dir apps/vscode-extension exec vsce package \
            --no-dependencies \
            --out "$release_directory/$package_name"
          pnpm --dir apps/vscode-extension exec vsce package \
            --no-dependencies \
            --out "$release_directory/repeated.vsix"
          node scripts/normalize-vsix-archive.mjs \
            "$release_directory/$package_name" \
            "$release_directory/repeated.vsix"
          cmp \
            "$release_directory/$package_name" \
            "$release_directory/repeated.vsix"
          unzip -Z1 "$release_directory/$package_name" > "$release_directory/vsix-files.txt"
          grep -Fxq "extension/LICENSE.txt" "$release_directory/vsix-files.txt"
          grep -Fxq "extension/NOTICE" "$release_directory/vsix-files.txt"
          grep -Fxq "extension/THIRD_PARTY_NOTICES.md" "$release_directory/vsix-files.txt"
          grep -Fxq "extension/readme.md" "$release_directory/vsix-files.txt"
          test "$(sha256sum LICENSE | cut -d ' ' -f 1)" = \
            "3f3d9e0024b1921b067d6f7f88deb4a60cbe7a78e76c64e3f1d7fc3b779b9d04"
          cmp <(unzip -p "$release_directory/$package_name" extension/LICENSE.txt) LICENSE
          cmp <(unzip -p "$release_directory/$package_name" extension/NOTICE) NOTICE
          cmp \
            <(unzip -p "$release_directory/$package_name" extension/THIRD_PARTY_NOTICES.md) \
            THIRD_PARTY_NOTICES.md
          if grep -Eiq '(^|/)native/|libredwg-adapter' "$release_directory/vsix-files.txt"; then
            echo "GPL adapter content must not be present in the MPL VSIX" >&2
            exit 1
          fi
          unzip -p "$release_directory/$package_name" extension/readme.md \
            | grep -Fq "https://github.com/menaje/dwg-viewer"

      - name: Attest VSIX provenance
        uses: actions/attest@v4
        with:
          subject-path: ${{ runner.temp }}/release/dwg-viewer-vscode-${{ steps.version.outputs.version }}.vsix

      - name: Upload VSIX
        uses: actions/upload-artifact@v7
        with:
          name: dwg-viewer-vscode
          path: ${{ runner.temp }}/release/dwg-viewer-vscode-${{ steps.version.outputs.version }}.vsix
          archive: false
          if-no-files-found: error

  adapter:
    name: GPL adapter (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x64
          - runner: macos-14
            target: darwin-arm64
          - runner: windows-2025
            target: win32-x64

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 11.12.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install locked packaging dependencies
        run: pnpm install --frozen-lockfile

      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: UCRT64
          update: true
          path-type: inherit
          install: >-
            diffutils
            make
            tar
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf

      - name: Build checksum-pinned static adapter
        if: runner.os != 'Windows'
        shell: bash
        run: |
          adapters/libredwg/prepare.sh \
            "$RUNNER_TEMP/dwg-libredwg-build" \
            "$RUNNER_TEMP/libredwg-adapter"

      - name: Run bounded self-diagnosis
        if: runner.os != 'Windows'
        shell: bash
        run: |
          DWG_VIEWER_ADAPTER_PROTOCOL=dwg-engine-adapter/1 \
          DWG_VIEWER_BENCHMARK_PHASE=doctor \
            "$RUNNER_TEMP/libredwg-adapter" doctor

      - name: Create and reproduce GPL source-complete package
        if: runner.os != 'Windows'
        shell: bash
        run: |
          package_path="$RUNNER_TEMP/dwg-viewer-libredwg-0.14-${{ matrix.target }}.tar.gz"
          repeated_path="$RUNNER_TEMP/dwg-viewer-libredwg-0.14-${{ matrix.target }}-repeated.tar.gz"
          node adapters/libredwg/package.mjs \
            --adapter "$RUNNER_TEMP/libredwg-adapter" \
            --libredwg-source "$RUNNER_TEMP/dwg-libredwg-build/libredwg-0.14.tar.xz" \
            --output "$package_path"
          node adapters/libredwg/package.mjs \
            --adapter "$RUNNER_TEMP/libredwg-adapter" \
            --libredwg-source "$RUNNER_TEMP/dwg-libredwg-build/libredwg-0.14.tar.xz" \
            --output "$repeated_path"
          cmp "$package_path" "$repeated_path"

      - name: Verify extracted checksums and executable
        if: runner.os != 'Windows'
        shell: bash
        run: |
          package_path="$RUNNER_TEMP/dwg-viewer-libredwg-0.14-${{ matrix.target }}.tar.gz"
          mkdir "$RUNNER_TEMP/extracted"
          tar -xzf "$package_path" -C "$RUNNER_TEMP/extracted"
          package_root=$(find "$RUNNER_TEMP/extracted" -mindepth 1 -maxdepth 1 -type d)
          cd "$package_root"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum -c SHA256SUMS
          else
            shasum -a 256 -c SHA256SUMS
          fi
          bin/libredwg-adapter doctor

      - name: Build, diagnose, reproduce, and verify Windows package
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          runner_temp=$(cygpath -u "$RUNNER_TEMP")
          build_root="$runner_temp/dwg-libredwg-build"
          adapter_path="$runner_temp/libredwg-adapter.exe"
          package_path="$runner_temp/dwg-viewer-libredwg-0.14-${{ matrix.target }}.tar.gz"
          repeated_path="$runner_temp/dwg-viewer-libredwg-0.14-${{ matrix.target }}-repeated.tar.gz"
          export DWG_VIEWER_TAR
          export DWG_VIEWER_OBJDUMP
          DWG_VIEWER_TAR=$(cygpath -w /usr/bin/tar.exe)
          DWG_VIEWER_OBJDUMP=$(cygpath -w /ucrt64/bin/objdump.exe)
          adapters/libredwg/prepare.sh "$build_root" "$adapter_path"
          DWG_VIEWER_ADAPTER_PROTOCOL=dwg-engine-adapter/1 \
          DWG_VIEWER_BENCHMARK_PHASE=doctor \
            "$adapter_path" doctor
          node adapters/libredwg/package.mjs \
            --adapter "$adapter_path" \
            --libredwg-source "$build_root/libredwg-0.14.tar.xz" \
            --output "$package_path"
          node adapters/libredwg/package.mjs \
            --adapter "$adapter_path" \
            --libredwg-source "$build_root/libredwg-0.14.tar.xz" \
            --output "$repeated_path"
          cmp "$package_path" "$repeated_path"
          mkdir "$runner_temp/extracted"
          tar -xzf "$package_path" -C "$runner_temp/extracted"
          package_root=$(find "$runner_temp/extracted" -mindepth 1 -maxdepth 1 -type d)
          cd "$package_root"
          sha256sum -c SHA256SUMS
          bin/libredwg-adapter.exe doctor

      - name: Build, reproduce, and inspect GPL companion VSIX
        if: runner.os != 'Windows'
        shell: bash
        run: |
          extension_version=$(node -p "require('./package.json').version")
          package_root=$(find "$RUNNER_TEMP/extracted" -mindepth 1 -maxdepth 1 -type d)
          companion_path="$RUNNER_TEMP/dwg-viewer-libredwg-$extension_version-${{ matrix.target }}.vsix"
          repeated_path="$RUNNER_TEMP/dwg-viewer-libredwg-$extension_version-${{ matrix.target }}-repeated.vsix"
          pnpm --dir apps/vscode-libredwg-adapter run prepare:package -- \
            --package-root "$package_root" \
            --target "${{ matrix.target }}"
          pnpm --dir apps/vscode-libredwg-adapter exec vsce package \
            --target "${{ matrix.target }}" \
            --no-dependencies \
            --out "$companion_path"
          pnpm --dir apps/vscode-libredwg-adapter exec vsce package \
            --target "${{ matrix.target }}" \
            --no-dependencies \
            --out "$repeated_path"
          node scripts/normalize-vsix-archive.mjs \
            "$companion_path" \
            "$repeated_path"
          cmp "$companion_path" "$repeated_path"
          rm "$repeated_path"
          unzip -Z1 "$companion_path" > "$RUNNER_TEMP/companion-vsix-files.txt"
          grep -Fxq "extension/LICENSE.txt" "$RUNNER_TEMP/companion-vsix-files.txt"
          grep -Fxq "extension/manifest.json" "$RUNNER_TEMP/companion-vsix-files.txt"
          grep -Fxq "extension/SHA256SUMS" "$RUNNER_TEMP/companion-vsix-files.txt"
          grep -Fxq \
            "extension/native/${{ matrix.target }}/libredwg-adapter" \
            "$RUNNER_TEMP/companion-vsix-files.txt"
          grep -Fxq \
            "extension/source/libredwg-0.14.tar.xz" \
            "$RUNNER_TEMP/companion-vsix-files.txt"
          grep -Fxq \
            "extension/source/dwg-viewer/adapters/libredwg/prepare.sh" \
            "$RUNNER_TEMP/companion-vsix-files.txt"
          cmp \
            <(unzip -p "$companion_path" extension/LICENSE.txt) \
            "$package_root/LICENSES/GPL-3.0-or-later.txt"

      - name: Build, reproduce, and inspect Windows GPL companion VSIX
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $extensionVersion = node -p "require('./package.json').version"
          $packageRoot = Get-ChildItem `
            -Path "$env:RUNNER_TEMP\extracted" `
            -Directory | Select-Object -First 1
          if (-not $packageRoot) {
            throw "extracted adapter package root was not found"
          }
          $companionPath = Join-Path `
            $env:RUNNER_TEMP `
            "dwg-viewer-libredwg-$extensionVersion-${{ matrix.target }}.vsix"
          $repeatedPath = Join-Path `
            $env:RUNNER_TEMP `
            "dwg-viewer-libredwg-$extensionVersion-${{ matrix.target }}-repeated.vsix"
          pnpm --dir apps/vscode-libredwg-adapter run prepare:package -- `
            --package-root $packageRoot.FullName `
            --target "${{ matrix.target }}"
          pnpm --dir apps/vscode-libredwg-adapter exec vsce package `
            --target "${{ matrix.target }}" `
            --no-dependencies `
            --out $companionPath
          pnpm --dir apps/vscode-libredwg-adapter exec vsce package `
            --target "${{ matrix.target }}" `
            --no-dependencies `
            --out $repeatedPath
          node scripts/normalize-vsix-archive.mjs `
            $companionPath `
            $repeatedPath
          if ((Get-FileHash $companionPath -Algorithm SHA256).Hash -ne `
              (Get-FileHash $repeatedPath -Algorithm SHA256).Hash) {
            throw "companion VSIX is not reproducible"
          }
          Remove-Item $repeatedPath
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead($companionPath)
          try {
            $entries = @($archive.Entries | ForEach-Object FullName)
            foreach ($required in @(
              "extension/LICENSE.txt",
              "extension/manifest.json",
              "extension/SHA256SUMS",
              "extension/native/${{ matrix.target }}/libredwg-adapter.exe",
              "extension/source/libredwg-0.14.tar.xz",
              "extension/source/dwg-viewer/adapters/libredwg/prepare.sh"
            )) {
              if ($entries -notcontains $required) {
                throw "companion VSIX is missing $required"
              }
            }
            $licenseEntry = $archive.GetEntry("extension/LICENSE.txt")
            $licenseStream = $licenseEntry.Open()
            try {
              $sha256 = [System.Security.Cryptography.SHA256]::Create()
              $packagedLicenseHash = [Convert]::ToHexString(
                $sha256.ComputeHash($licenseStream)
              )
            } finally {
              $licenseStream.Dispose()
            }
            $sourceLicense = Join-Path `
              $packageRoot.FullName `
              "LICENSES\GPL-3.0-or-later.txt"
            if ($packagedLicenseHash -ne `
                (Get-FileHash $sourceLicense -Algorithm SHA256).Hash) {
              throw "companion VSIX GPL text differs from the source package"
            }
          } finally {
            $archive.Dispose()
          }

      - name: Attest adapter and companion provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            ${{ runner.temp }}/dwg-viewer-libredwg-0.14-${{ matrix.target }}.tar.gz
            ${{ runner.temp }}/dwg-viewer-libredwg-*-${{ matrix.target }}.vsix

      - name: Upload adapter package
        uses: actions/upload-artifact@v7
        with:
          name: dwg-viewer-libredwg-archive-${{ matrix.target }}
          path: ${{ runner.temp }}/dwg-viewer-libredwg-0.14-${{ matrix.target }}.tar.gz
          archive: false
          if-no-files-found: error

      - name: Upload GPL companion VSIX
        uses: actions/upload-artifact@v7
        with:
          name: dwg-viewer-libredwg-vsix-${{ matrix.target }}
          path: ${{ runner.temp }}/dwg-viewer-libredwg-*-${{ matrix.target }}.vsix
          archive: false
          if-no-files-found: error

  marketplace:
    name: Optional Marketplace prerelease
    needs:
      - vsix
      - adapter
    if: github.event_name == 'workflow_dispatch' && inputs.publish_marketplace
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 11.12.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/download-artifact@v8
        with:
          pattern: dwg-viewer-*
          path: dist
          merge-multiple: true

      - name: Install locked publishing dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate explicit tag publication
        id: version
        shell: bash
        run: |
          release_version=$(node -p "require('./package.json').version")
          if [[ "$GITHUB_REF" != "refs/tags/v$release_version" ]]; then
            echo "Marketplace publication requires manually dispatching the matching v$release_version tag" >&2
            exit 1
          fi
          printf 'version=%s\n' "$release_version" >> "$GITHUB_OUTPUT"

      - name: Publish GPL platform companions before the MPL viewer
        shell: bash
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [[ -z "$VSCE_PAT" ]]; then
            echo "VSCE_PAT is required for Marketplace publication" >&2
            exit 1
          fi
          version="${{ steps.version.outputs.version }}"
          for target in linux-x64 darwin-arm64 win32-x64; do
            pnpm --dir apps/vscode-libredwg-adapter exec vsce publish \
              --packagePath "$GITHUB_WORKSPACE/dist/dwg-viewer-libredwg-$version-$target.vsix" \
              --pre-release \
              --pat "$VSCE_PAT"
          done
          pnpm --dir apps/vscode-extension exec vsce publish \
            --packagePath "$GITHUB_WORKSPACE/dist/dwg-viewer-vscode-$version.vsix" \
            --pre-release \
            --pat "$VSCE_PAT"

  assemble:
    name: Checksums and optional GitHub release
    needs:
      - vsix
      - adapter
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: dwg-viewer-*
          path: dist
          merge-multiple: true

      - name: Validate and checksum release set
        id: version
        shell: bash
        run: |
          release_version=$(node -p "require('./package.json').version")
          if [[ "$GITHUB_REF" == refs/tags/* ]] && [[ "$GITHUB_REF_NAME" != "v$release_version" ]]; then
            echo "release tag must be v$release_version" >&2
            exit 1
          fi
          test -f "dist/dwg-viewer-vscode-$release_version.vsix"
          test -f "dist/dwg-viewer-libredwg-$release_version-linux-x64.vsix"
          test -f "dist/dwg-viewer-libredwg-$release_version-darwin-arm64.vsix"
          test -f "dist/dwg-viewer-libredwg-$release_version-win32-x64.vsix"
          test -f "dist/dwg-viewer-libredwg-0.14-linux-x64.tar.gz"
          test -f "dist/dwg-viewer-libredwg-0.14-darwin-arm64.tar.gz"
          test -f "dist/dwg-viewer-libredwg-0.14-win32-x64.tar.gz"
          cd dist
          sha256sum \
            "dwg-viewer-vscode-$release_version.vsix" \
            "dwg-viewer-libredwg-$release_version-linux-x64.vsix" \
            "dwg-viewer-libredwg-$release_version-darwin-arm64.vsix" \
            "dwg-viewer-libredwg-$release_version-win32-x64.vsix" \
            "dwg-viewer-libredwg-0.14-linux-x64.tar.gz" \
            "dwg-viewer-libredwg-0.14-darwin-arm64.tar.gz" \
            "dwg-viewer-libredwg-0.14-win32-x64.tar.gz" \
            > SHA256SUMS
          printf 'version=%s\n' "$release_version" >> "$GITHUB_OUTPUT"

      - name: Attest the checksum release set
        uses: actions/attest@v4
        with:
          subject-checksums: dist/SHA256SUMS

      - name: Upload checksums
        uses: actions/upload-artifact@v7
        with:
          name: dwg-viewer-checksums
          path: dist/SHA256SUMS
          archive: false
          if-no-files-found: error

      - name: Publish tagged GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release_notes="$RUNNER_TEMP/release-notes.md"
          printf '%s\n\n%s\n\n%s\n\n%s\n\n%s\n' \
            "Prerelease: open, inspect, search, measure, and export DWG drawings directly in VS Code." \
            "Navigation supports click-drag, two-finger trackpad panning, stronger pinch zoom, compact icon tools with hover labels, and English or Korean controls selected from the VS Code environment." \
            "Marketplace installation adds the matching LibreDWG Engine companion automatically. For manual installation, install the main VSIX and the companion VSIX for Linux x64, macOS arm64, or Windows x64." \
            "The main VSIX is MPL-2.0. Each separate GPL-3.0-or-later companion VSIX includes its executable's complete corresponding source and unmodified license texts." \
            "Verify SHA256SUMS and the GitHub artifact attestations before installation." \
            > "$release_notes"
          gh release create "$GITHUB_REF_NAME" \
            "dist/dwg-viewer-vscode-${{ steps.version.outputs.version }}.vsix" \
            "dist/dwg-viewer-libredwg-${{ steps.version.outputs.version }}-linux-x64.vsix" \
            "dist/dwg-viewer-libredwg-${{ steps.version.outputs.version }}-darwin-arm64.vsix" \
            "dist/dwg-viewer-libredwg-${{ steps.version.outputs.version }}-win32-x64.vsix" \
            "dist/dwg-viewer-libredwg-0.14-linux-x64.tar.gz" \
            "dist/dwg-viewer-libredwg-0.14-darwin-arm64.tar.gz" \
            "dist/dwg-viewer-libredwg-0.14-win32-x64.tar.gz" \
            "dist/SHA256SUMS" \
            --verify-tag \
            --prerelease \
            --title "DWG Viewer $GITHUB_REF_NAME" \
            --notes-file "$release_notes"
