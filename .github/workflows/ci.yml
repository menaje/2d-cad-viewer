name: CI

on:
  push:
    branches: [main, dev, prerelease]
  pull_request:

concurrency:
  group: dwg-viewer-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy,rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace --locked

  webview-and-vscode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.12.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check release channel contracts
        run: pnpm run check:release-channel
      - name: Check adapter packaging
        run: pnpm run check:adapter-package
      - name: Check render protocol
        run: pnpm --filter @menaje/viewer-render-protocol check
      - name: Check Viewer Core contracts
        run: pnpm --filter @menaje/viewer-core check
      - name: Check Viewer UI contracts
        run: pnpm --filter @menaje/viewer-ui check
      - name: Check DWG Scene source
        run: pnpm --filter @menaje/dwg-scene-source check
      - name: Check native document adapter contract
        run: pnpm --filter @dwg-viewer/native-document-adapter check
      - name: Check Webview
        run: pnpm --filter @menaje/viewer-webgl check
      - name: Check VS Code extension
        run: pnpm --filter dwg-viewer-vscode check
      - name: Qualify Viewer-owned package and standalone boundary
        run: pnpm run qualify:viewer-boundary
      - name: Package VSIX
        run: pnpm --filter dwg-viewer-vscode package:vsix

  windows-vscode-host:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.12.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Check Windows extension host paths and process cleanup
        run: pnpm --filter dwg-viewer-vscode check
