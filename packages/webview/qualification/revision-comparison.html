<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Viewer WebGL revision comparison qualification</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        background: #111820;
        color: #d9e2ec;
        font: 14px/1.4 system-ui, sans-serif;
      }
      body {
        display: grid;
        grid-template-rows: minmax(0, 1fr) auto;
      }
      #comparison {
        min-width: 0;
        min-height: 0;
      }
      [data-viewer-split-label] {
        padding: 6px 10px;
        background: #1c2733;
      }
      [data-viewer-split-divider] {
        background: #3b82f6;
      }
      #render-canvas {
        width: 640px;
        height: 360px;
      }
      #result {
        box-sizing: border-box;
        max-height: 32vh;
        margin: 0;
        padding: 10px;
        overflow: auto;
        background: #0a0f14;
        color: #9fe6a0;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <section id="comparison" aria-label="Actual WebGL comparison"></section>
    <pre id="result" aria-live="polite">running</pre>
    <canvas id="render-canvas" width="640" height="360"></canvas>
    <script type="importmap">
      {
        "imports": {
          "@menaje/dwg-scene-source": "../../dwg-scene-source/src/index.mjs?v=1.26.0",
          "@menaje/dwg-scene-source/range-source": "../../dwg-scene-source/src/range-source.mjs?v=1.26.0",
          "@menaje/dwg-scene-source/scene-cache": "../../dwg-scene-source/src/scene-cache.mjs?v=1.26.0",
          "@menaje/viewer-webgl": "../src/public-api.mjs",
          "@menaje/viewer-render-protocol": "../../render-protocol/src/index.mjs",
          "@menaje/viewer-core": "../../viewer-core/src/index.mjs",
          "@menaje/viewer-core/batch-cache": "../../viewer-core/src/batch-cache.mjs",
          "@menaje/viewer-core/camera": "../../viewer-core/src/camera.mjs",
          "@menaje/viewer-core/detail-streaming": "../../viewer-core/src/detail-streaming-controller.mjs",
          "@menaje/viewer-core/interaction": "../../viewer-core/src/viewport-interaction.mjs",
          "@menaje/viewer-core/selection": "../../viewer-core/src/selection-controller.mjs",
          "@menaje/viewer-ui": "../../viewer-ui/src/index.mjs",
          "#shx-parser": "../node_modules/@mlightcad/shx-parser/dist/index.es.js",
          "earcut": "../node_modules/earcut/src/earcut.js"
        }
      }
    </script>
    <script type="module" src="./revision-comparison.mjs"></script>
  </body>
</html>
